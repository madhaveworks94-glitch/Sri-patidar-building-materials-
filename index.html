<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patidar Accounts</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5c4d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Accounts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#16201d;--mute:#6b746f;--line:#e5e2d8;--g:#0f5c4d;--g2:#17806b;--gl:#e3f1ec;--amb:#c77d0a;--ok:#12803f;--bad:#c0392b;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 0}
.app{max-width:760px;margin:0 auto;padding:10px 14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{flex:none;width:34px;height:34px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.gear{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--mute);text-decoration:none;padding:7px 0;border-radius:14px}
nav a.on{color:var(--g);background:var(--gl)}
h1{font-size:26px;margin:4px 0 2px;font-weight:800;letter-spacing:-.4px}
h2{font-size:17px;margin:20px 2px 8px;font-weight:800}
.sub{color:var(--mute);margin:0 0 14px}
.mute{color:var(--mute)}small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.hero{background:linear-gradient(150deg,var(--g2),var(--g));color:#fff;border:0}
.hero h3{color:#bfe3d8}
.num{font-size:30px;font-weight:800;letter-spacing:-.6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.kpi h3{margin:0 0 4px;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.kpi .num{font-size:22px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.hero .ok,.hero .bad{color:#fff}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:12px 0 5px}
input,select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g2)}
input[type=date],input[type=month]{min-width:0}
textarea{min-height:70px;resize:vertical}
.btn{display:grid;place-items:center;width:100%;min-height:48px;border:0;border-radius:14px;font:700 15px inherit;font-family:inherit;cursor:pointer;margin-top:10px;background:var(--g);color:#fff;padding:0 14px;text-decoration:none}
.btn.ghost{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.soft{background:var(--gl);color:var(--g)}
.btn.red{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{min-height:38px;width:auto;display:inline-grid;font-size:13.5px;margin:0;padding:0 14px;border-radius:11px}
.btn:disabled{opacity:.5}
.btn:active,.chip:active,.item:active{transform:scale(.97)}
.btns{display:flex;gap:8px}.btns .btn{margin-top:10px}
.link{background:none;border:0;color:var(--g);font:inherit;font-weight:700;cursor:pointer;padding:6px 2px}
.msg{min-height:20px;margin-top:8px;font-size:13.5px;font-weight:600;color:var(--bad)}.msg.ok{color:var(--ok)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:8px 14px;font:700 13.5px inherit;font-family:inherit;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#e9e6dc;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:11px;padding:10px 4px;font:700 14px inherit;font-family:inherit;color:var(--mute);cursor:pointer}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.datebar{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:center;margin-bottom:12px}
.datebar button{height:46px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-size:20px;color:var(--g);cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.item .r{text-align:right;flex:none}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;color:var(--mute);text-align:left;padding:8px 6px;border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:.3px}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tr.tap{cursor:pointer}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.empty{text-align:center;color:var(--mute);padding:22px 10px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--gl);color:var(--g)}
.pill.warn{background:#fdecc8;color:#8a5200}.pill.red{background:#fbe1dd;color:var(--bad)}
.bar{height:10px;border-radius:6px;background:#ece9df;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2);border-radius:6px}
.bar.amb i{background:var(--amb)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,17,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin-top:0}
.sig{border:1.5px dashed #aab3ae;border-radius:12px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
.sigimg{max-height:70px;max-width:100%;display:block;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad)}
.inv{background:#fff;color:#111;border:1px solid #cfcfcf;padding:14px;font-size:12.5px;line-height:1.4;overflow-x:auto}
.inv *{color:#111}.inv .m{color:#555}
.inv-t{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:8px}
.inv-t b{font-size:17px;letter-spacing:.6px}
.inv-p{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.inv-p div{border:1px solid #bbb;padding:7px;border-radius:4px}
.inv table{width:100%;border-collapse:collapse;min-width:560px}
.inv th,.inv td{border:1px solid #888;padding:4px 5px;font-size:11.5px}
.inv th{background:#eee;text-align:left}.inv td.n,.inv th.n{text-align:right}
.inv-s{display:flex;justify-content:space-between;gap:12px;margin-top:10px;align-items:flex-end;flex-wrap:wrap}
.inv-s img{max-height:56px;max-width:180px;display:block;margin-left:auto}
.svg{width:100%;height:auto;display:block}
.pick{display:grid;gap:8px}
.lineitem{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.lineitem .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.x{border:0;background:#fbe1dd;color:var(--bad);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;flex:none}
.total{display:flex;justify-content:space-between;padding:5px 0}.total.big{font-size:19px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:9px}
@media print{nav,.top,.btn,.seg{display:none}}
.tbl td:first-child{white-space:nowrap}
@media(max-width:480px){.tbl{font-size:12.5px}.tbl td,.tbl th{padding-left:4px;padding-right:4px}.card .scroll{margin:0 -6px}}
</style>
</head><body>

 <main id="view"></main>
</div>
<nav id="nav"></nav>
<script type="module" src="app.js"></script>
