name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Collect web files
        run: |
          mkdir www
          cp index.html styles.css app.js store.js billing.js khata.js inventory.js pdfimport.js fleet.js reports.js backup.js sw.js manifest.webmanifest icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dukaan-os-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
