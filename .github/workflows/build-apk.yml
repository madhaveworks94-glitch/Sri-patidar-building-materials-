name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Use the fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "Using fixed key"; else echo "No fixed key set"; fi
      - name: Collect web files
        run: |
          mkdir www
                  cp index.html styles.css *.js manifest.webmanifest icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - run: pip install pillow || pip install --break-system-packages pillow
      - run: python3 make_icons.py
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dukaan-os-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
