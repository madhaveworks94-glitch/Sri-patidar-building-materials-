name: Build iPhone app (IPA)
# Run it by hand: Actions tab -> Build iPhone app (IPA) -> Run workflow.
# With the 4 Apple secrets set (see the list below) it builds a SIGNED app and sends it to TestFlight.
# Without them it only makes an UNSIGNED .ipa, which an iPhone will not install until someone signs it.
#   APPSTORE_KEY_ID      Key ID of the App Store Connect API key
#   APPSTORE_ISSUER_ID   Issuer ID shown on the same page
#   APPSTORE_KEY_P8      full text of the downloaded AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID        10-character Team ID from the Apple Developer account
on:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the Apple secrets
        id: sign
        env:
          K: ${{ secrets.APPSTORE_KEY_ID }}
          I: ${{ secrets.APPSTORE_ISSUER_ID }}
          P: ${{ secrets.APPSTORE_KEY_P8 }}
          T: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$K" ] && [ -n "$I" ] && [ -n "$P" ] && [ -n "$T" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; echo "All 4 Apple secrets found: building a signed app."; else echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::warning::Apple secrets missing. Building an UNSIGNED ipa only."; fi
      - name: Collect web files
        run: |
          mkdir www
          cp index.html styles.css *.js manifest.webmanifest icon-192.png icon-512.png www/
      - run: npm install
      - name: Bundle the sharing library
        run: cp node_modules/peerjs/dist/peerjs.min.js www/
      - run: npx cap add ios
      - name: App icon, version and export setting
        run: |
          pip3 install pillow || pip3 install --break-system-packages pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          src=Image.open('icon-512.png').convert('RGBA')
          bg=Image.new('RGB',src.size,(255,255,255));bg.paste(src,mask=src.split()[3])
          bg=bg.resize((1024,1024),Image.LANCZOS)
          files=glob.glob('ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png')
          for f in files: bg.save(f)
          print('Icons written:',files)
          PY
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || true
      - run: npx cap sync ios
      - name: Build unsigned IPA
        if: steps.sign.outputs.signed != 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 archive
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/out/Payload/"
          (cd "$RUNNER_TEMP/out" && zip -qr "$GITHUB_WORKSPACE/DukaanOS-unsigned.ipa" Payload)
      - name: Build signed IPA and send to TestFlight
        if: steps.sign.outputs.signed == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          printf '%s\n' "$KEY_P8" > "$KEYFILE"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEYFILE -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -destination 'generic/platform=iOS' $AUTH \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 archive
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>$TEAM</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/export.plist" $AUTH
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/DukaanOS.ipa"
          xcrun altool --upload-app -f "$GITHUB_WORKSPACE/DukaanOS.ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
      - uses: actions/upload-artifact@v4
        with:
          name: DukaanOS-ipa
          path: |
            DukaanOS.ipa
            DukaanOS-unsigned.ipa
          if-no-files-found: error
